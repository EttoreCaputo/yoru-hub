[package]
name = "yoru-app"
version = "0.1.0"
edition = "2024"
description = "Yoru, the personal assistant with a body on the desk: the desktop app"
authors = ["Ettore Caputo <ettore.caputo27@gmail.com>"]
license = "MIT"
repository = "https://github.com/EttoreCaputo/yoru-hub"

[lib]
name = "yoru_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yoru-app"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
yoru-core = { version = "0.1.0", path = "../../core", features = ["provision", "mcp", "connectors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.11.6", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2.4.5"

# The Yoru in the notch: its window above the menu bar, and the notch's size.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "NSWindow", "NSResponder", "NSGraphics", "NSColor", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSArray"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGError"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
