[package]
name = "yoru-app"
version = "0.1.0"
edition = "2024"
description = "Yoru, the personal assistant with a body on the desk: the desktop app"
authors = ["Ettore Caputo <ettore.caputo27@gmail.com>"]
license = "MIT"
repository = "https://github.com/EttoreCaputo/yoru-hub"

[lib]
name = "yoru_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yoru-app"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
yoru-core = { version = "0.1.0", path = "../../core", features = ["provision", "mcp", "connectors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
