[package]
name = "companion-hub"
version = "0.1.0"
edition = "2024"
description = "Desktop hub for the DualEye and Yoru desk companions"
authors = ["Ettore Caputo <ettore.caputo27@gmail.com>"]
license = "MIT"
repository = "https://github.com/EttoreCaputo/companion-hub"

[lib]
name = "companion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "companion-hub"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
companion-core = { version = "0.1.0", path = "../../core", features = ["provision", "mcp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"

# SMAppService, to install the root helper that reads the CPU power (macOS 27).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
