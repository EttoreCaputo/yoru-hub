[package]
name = "companion-cli"
version = "0.1.0"
edition = "2024"
description = "Command line for the DualEye and Yoru desk companions"
authors = ["Ettore Caputo <ettore.caputo27@gmail.com>"]
license = "MIT"
repository = "https://github.com/EttoreCaputo/companion-hub"

[[bin]]
name = "companion"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
companion-core = { path = "../core", features = ["mcp", "download"] }
serde_json = "1.0.151"
