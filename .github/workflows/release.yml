# On every push to main: build Yoru's firmware from its own repository,
# then the desktop app for macOS (Apple Silicon and Intel; Linux and Windows
# are off for now) with that firmware inside, and with whisper.cpp's and llama.cpp's
# servers for voice (tools/build_sidecars.sh), and publish them all on the
# GitHub release `v<app version>`.
#
# The release is named after `version` in app/src-tauri/tauri.conf.json.
# Bump it for a new release; until then each merge refreshes the assets of
# the current one. Each firmware's version is its repository's version.txt,
# and its FIRMWARE_CHANGELOG.md must have a section for it.
#
# A push to develop builds the same assets for the pre-release
# `v<app version>-develop`, recreated on that commit every time, so it never
# touches the stable release.
#
# The firmware repository is checked out at its default branch, or at
# YORU_REF (a repository variable). A private one needs a FIRMWARE_TOKEN
# secret that can read it.

name: Release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ESP_IDF_VERSION: v6.1

jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: yoru
            repository: EttoreCaputo/Yoru
            ref_var: YORU_REF
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ vars[matrix.ref_var] }}
          token: ${{ secrets.FIRMWARE_TOKEN || github.token }}

      - name: Check version.txt has a changelog entry
        id: version
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if ! grep -Eq "^##[[:space:]]+v?${version//./\\.}[[:space:]]*$" FIRMWARE_CHANGELOG.md; then
            echo "::error file=FIRMWARE_CHANGELOG.md::No '## $version' section for the version in version.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with ESP-IDF ${{ env.ESP_IDF_VERSION }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          command: idf.py build merge-bin

      - name: Check the image carries version.txt
        run: |
          built="$(python3 - <<'PY'
          import struct
          image = open("build/merged-binary.bin", "rb").read()
          # First app partition in the table at 0x8000, then its esp_app_desc_t.
          for i in range(0x8000, 0x8C00, 32):
              if image[i:i + 2] != b"\xaa\x50":
                  break
              if image[i + 2] == 0:
                  desc = struct.unpack_from("<I", image, i + 4)[0] + 32
                  print(image[desc + 16:desc + 48].split(b"\0")[0].decode())
                  break
          PY
          )"
          echo "image version: $built"
          test "$built" = "${{ steps.version.outputs.version }}"

      - name: Lay it out as firmware/${{ matrix.board }}
        run: |
          mkdir -p out
          cp build/merged-binary.bin version.txt FIRMWARE_CHANGELOG.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: out/
          if-no-files-found: error

  release:
    name: Prepare release
    needs: firmware
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware

      - name: Create or refresh the release
        id: release
        run: |
          for d in firmware/firmware-*; do mv "$d" "firmware/${d#firmware/firmware-}"; done
          app="$(jq -r .version app/src-tauri/tauri.conf.json)"
          tag="v$app"
          title="Yoru $app"
          if [ "$GITHUB_REF_NAME" = develop ]; then
            tag="v$app-develop"
            title="Yoru $app (develop)"
          fi
          yoru="$(tr -d '[:space:]' < firmware/yoru/version.txt)"
          {
            if [ "$GITHUB_REF_NAME" = develop ]; then
              echo "> Development build from \`develop\`, rebuilt on every push. For the stable app, use the latest release."
              echo
            fi
            echo "Yoru $app, the personal assistant with a body on the desk, with Yoru firmware **$yoru** inside. Plug the board in, open the app, and it offers to flash the firmware when the board runs an older one."
            echo
            echo "### Yoru firmware $yoru"
            awk -v v="$yoru" '/^## /{p = ($2 == v || $2 == "v" v); next} p' firmware/yoru/FIRMWARE_CHANGELOG.md
            echo
            echo "### Downloads"
            # echo "- **Windows**: \`Yoru_${app}_windows-x64-setup.exe\` or \`.msi\`."
            echo "- **macOS Apple Silicon** (M1 and later): \`Yoru_${app}_macos-apple-silicon.dmg\`."
            echo "- **macOS Intel**: \`Yoru_${app}_macos-intel.dmg\`."
            echo "  The app isn't notarized: the first time, open it, then allow it in System Settings → Privacy & Security (Open Anyway), or run \`xattr -cr \"/Applications/Yoru.app\"\`."
            # echo "- **Linux**: \`Yoru_${app}_linux-x64\` as \`.AppImage\`, \`.deb\` or \`.rpm\`."
            echo "- \`yoru-firmware-$yoru.bin\`: the merged image alone, to flash at 0x0 with esptool."
            echo
            echo "Voice: the app ships whisper.cpp and llama.cpp (MIT); it downloads the models, and installs Piper (GPL-3.0) when you ask."
            echo
            echo "Built from ${GITHUB_SHA::7}."
          } > notes.md
          if [ "$GITHUB_REF_NAME" = develop ]; then
            # Move the tag to this commit: drop the old pre-release and its tag.
            gh release delete "$tag" --cleanup-tag --yes > /dev/null 2>&1 || true
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease --latest=false
          elif gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          fi
          cp firmware/yoru/merged-binary.bin "yoru-firmware-$yoru.bin"
          gh release upload "$tag" "yoru-firmware-$yoru.bin" --clobber
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)" >> "$GITHUB_OUTPUT"

  app:
    name: App (${{ matrix.name }})
    needs: [firmware, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows are off for now: only macOS ships. Uncomment
          # them (and their lines in the release notes) to bring them back.
          # - name: Linux
          #   os: ubuntu-22.04
          #   platform: linux-x64
          #   args: ""
          # - name: Windows
          #   os: windows-latest
          #   platform: windows-x64
          #   args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            platform: macos-apple-silicon
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            platform: macos-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # The app's own OAuth clients (docs/oauth-clients.md), compiled in: with
    # them Google, GitHub, Slack, Box, Asana and HubSpot sign in with one
    # click. Unset secrets build an app where those need the user's client.
    env:
      YORU_GOOGLE_CLIENT_ID: ${{ secrets.YORU_GOOGLE_CLIENT_ID }}
      YORU_GOOGLE_CLIENT_SECRET: ${{ secrets.YORU_GOOGLE_CLIENT_SECRET }}
      YORU_GITHUB_CLIENT_ID: ${{ secrets.YORU_GITHUB_CLIENT_ID }}
      YORU_GITHUB_CLIENT_SECRET: ${{ secrets.YORU_GITHUB_CLIENT_SECRET }}
      YORU_SLACK_CLIENT_ID: ${{ secrets.YORU_SLACK_CLIENT_ID }}
      YORU_SLACK_CLIENT_SECRET: ${{ secrets.YORU_SLACK_CLIENT_SECRET }}
      YORU_BOX_CLIENT_ID: ${{ secrets.YORU_BOX_CLIENT_ID }}
      YORU_BOX_CLIENT_SECRET: ${{ secrets.YORU_BOX_CLIENT_SECRET }}
      YORU_ASANA_CLIENT_ID: ${{ secrets.YORU_ASANA_CLIENT_ID }}
      YORU_ASANA_CLIENT_SECRET: ${{ secrets.YORU_ASANA_CLIENT_SECRET }}
      YORU_HUBSPOT_CLIENT_ID: ${{ secrets.YORU_HUBSPOT_CLIENT_ID }}
      YORU_HUBSPOT_CLIENT_SECRET: ${{ secrets.YORU_HUBSPOT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # The app embeds firmware/<board>/ (see FIRMWARE in src-tauri/src/lib.rs).
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware

      - name: Name the firmware folders by board
        shell: bash
        run: for d in firmware/firmware-*; do mv "$d" "firmware/${d#firmware/firmware-}"; done

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      # whisper-server and llama-server, bundled next to the app. Their
      # versions are pinned in the script, so its hash keys the cache.
      - name: Cache the voice sidecars
        id: sidecars
        uses: actions/cache@v4
        with:
          path: app/src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ matrix.target || 'native' }}-${{ hashFiles('tools/build_sidecars.sh') }}

      - name: Build the voice sidecars
        if: steps.sidecars.outputs.cache-hit != 'true'
        shell: bash
        run: JOBS=4 tools/build_sidecars.sh ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      # The AppImage bundler downloads linuxdeploy and AppRun from GitHub on
      # every build; keep them so a dropped connection there can't fail the job.
      - name: Cache the AppImage tools
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-appimage-tools-${{ runner.os }}

      - uses: tauri-apps/tauri-action@v0
        id: bundle
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.release.outputs.id }}
          # e.g. Yoru_0.1.0_macos-apple-silicon.dmg, Yoru_0.1.0_windows-x64-setup.exe
          assetNamePattern: "[name]_[version]_${{ matrix.platform }}[setup][ext]"
          args: ${{ matrix.args }} --config src-tauri/tauri.sidecars.conf.json

      # One more try when the first fails, usually a download that timed out
      # or was reset (linuxdeploy, WiX, NSIS). The compile is cached by then.
      - name: Retry the bundle
        if: steps.bundle.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.release.outputs.id }}
          assetNamePattern: "[name]_[version]_${{ matrix.platform }}[setup][ext]"
          args: ${{ matrix.args }} --config src-tauri/tauri.sidecars.conf.json

      # tauri-action always uploads the macOS .app as .app.tar.gz too; the
      # .dmg is the only download macOS needs.
      - name: Drop the .app.tar.gz
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ needs.release.outputs.tag }}" --json assets \
            --jq '.assets[].name | select(endswith("_${{ matrix.platform }}.app.tar.gz"))' |
            while read -r asset; do
              gh release delete-asset "${{ needs.release.outputs.tag }}" "$asset" --yes
            done
